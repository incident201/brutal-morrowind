PageName: Brutal Morrowind
Blank: ''
"On": 'On'
"Off": 'Off'
PageDescription: "Choose which components to use."
PageDescriptionNoDarkMessiah: "Choose which components to use.\n\nDark Messiah data is not imported: Morrowind animations are used and the components that need Dark Messiah animations, sounds or textures are off. Import it on the Dark Messiah page of the launcher."
GroupName: Options
darkMessiah: Dark Messiah
morrowind: Morrowind
enabled: Enable Brutal Morrowind
enabledDescription: "Master switch. Individual component choices are preserved."
allowThirdPerson: Allow third person view
allowThirdPersonDescription: "Click the mouse wheel to switch views. Temporarily disables first-person components."
firstPersonBody: Visible first-person body (FPV)
firstPersonBodyDescription: "Show your own body when looking down."
firstPersonAnimations: First-person animations
firstPersonAnimationsDescription: "Choose the arm and weapon animation set."
npcAnimations: NPC animations
npcAnimationsDescription: "Choose the NPC animation set."
guaranteedHits: 100% melee hit chance
guaranteedHitsDescription: "Turn off to restore skill- and fatigue-based hit rolls."
meleeGeometry: Weapon contact and wide swings
meleeGeometryDescription: "Use visible weapon contact and the swing area."
ragdollEnabled: Ragdoll
ragdollEnabledDescription: "Physical falls for NPCs and creatures, including body enhancements, joint limits, dropped equipment physics and living NPC recovery (recovery needs Dark Messiah animations)."
ragdollWeaponDrop: Weapon drop chance, %
ragdollWeaponDropDescription: "Chance per held weapon when a living NPC is knocked down. Held weapons always drop on death. This chance also applies to shields and loaded ammunition."
dynamicProps: Movable world items
dynamicPropsDescription: "Impacts move loose items."
objectGrabEnabled: Grab and throw items
objectGrabEnabledDescription: "Pick up small world items, carry them, drop them, or throw them at enemies. In adrenaline, throws knock enemies into ragdoll."
movementEnabled: Walking, running and sprinting
movementEnabledDescription: "Dark Messiah speeds. Alt walks; sprint uses the assigned button."
staminaEnabled: Dark Messiah stamina
staminaEnabledDescription: "Dark Messiah stamina costs and recovery."
kickEnabled: Kick
kickEnabledDescription: "Kick using the assigned button."
kickAlwaysRagdoll: Kick always triggers ragdoll
kickAlwaysRagdollDescription: "Ordinary non-adrenaline kicks always knock NPCs and supported creatures into ragdoll with normal kick damage, stamina cost, and pushback."
slideEnabled: Slide
slideEnabledDescription: "Crouch while sprinting or running to slide."
activeBlockEnabled: Manual blocking
activeBlockEnabledDescription: "Hold RMB to guard with a shield."
shieldBashEnabled: Shield bash
shieldBashEnabledDescription: "Click attack while blocking with a shield to bash."
parryEnabled: Sword parry
parryEnabledDescription: "Hold RMB to guard with a melee weapon."
clinchEnabled: Blade clinch
clinchEnabledDescription: "Attack after a parry. Requires Dark Messiah animations."
attackCombosEnabled: Rush and falling attacks
attackCombosEnabledDescription: "Special strikes while rushing or falling."
fastAttacksEnabled: Fast attack chains
fastAttacksEnabledDescription: "Chain attacks with short clicks. Requires Dark Messiah arm animations."
wallBounceEnabled: Weapon recoil from walls
wallBounceEnabledDescription: "Weapons recoil after striking scenery."
npcAiTweaks: NPC AI tweaks
npcAiTweaksDescription: "Dark Messiah combat pacing, windups and dodges."
npcStagger: NPC hit reactions
npcStaggerDescription: "Enemies flinch and stagger when hit."
woundedNpcs: Wounded NPCs
woundedNpcsDescription: "Below 30% health an NPC fights and walks wounded, as in Dark Messiah: its parry and shield block often give way, blows stagger it, and a charged blow, kick or shield bash can knock it down. Argonians and Khajiit keep their own stance and walk."
npcFlee: NPC flight
npcWeaponPickup: NPCs pick up weapons
npcWeaponPickupDescription: "An NPC left without a weapon in a fight runs to a weapon lying nearby, picks it up and fights with it. A shield lying right beside it is taken too."
npcFleeDescription: "A blow that leaves an NPC below 10% health makes it run away for up to 20 seconds; then it fights on until the next blow."
hitRecovery: Suppress player hit recoil
hitRecoveryDescription: "Damage does not interrupt player actions."
adrenalineEnabled: Adrenaline and finishers
adrenalineEnabledDescription: "Damaging hits charge a finisher or super kick."
slowMotionEnabled: Finisher slow motion
slowMotionEnabledDescription: "Brief slow motion after a lethal adrenaline strike."
dismemberment: Dismemberment
dismembermentDescription: "Finishers sever body parts. Requires ragdoll."
bloodEffects: Blood effects
bloodEffectsDescription: "The mod’s blood sprays."
sparkEffects: Impact sparks
sparkEffectsDescription: "Sparks on metal and scenery impacts."
bloodDecals: Blood marks
bloodDecalsDescription: "Blood marks on bodies and surfaces."
weaponBlood: Blood on weapons
weaponBloodDescription: "Melee weapons keep the blood of those they strike. It dries, washes off in rain or water, is cleaned by repair and wears away after a day."
worldBlood: Blood on floors and walls
worldBloodDescription: "Hits on living flesh leave splatters on nearby floors and walls."
combatSounds: Dark Messiah sounds
combatSoundsDescription: "Weapon, impact, kick, adrenaline, footstep, jump and landing sounds from Dark Messiah. Off: Morrowind sounds."
heroVoice: Hero voice
heroVoiceDescription: "The hero's grunts from Dark Messiah: on an adrenaline strike or super kick, on a throw and on a jump. Other Dark Messiah sounds stay."
adrenalineHudEnabled: Adrenaline gauge
adrenalineHudEnabledDescription: "A charge indicator beside the native status bars."
adrenalineFxEnabled: Adrenaline screen effect
adrenalineFxEnabledDescription: "A screen effect at full charge."
slideFxEnabled: Slide speed effect
slideFxEnabledDescription: "Speed streaks at the edges of the screen."
clinchFxEnabled: Clinch blur
clinchFxEnabledDescription: "Brief blur after losing a clinch."
superKickSpeed: Adrenaline kick impulse
superKickSpeedDescription: "Super kick launch speed. Ordinary kicks use 460 units/s."
adrenalineFastHits: Fast hits to fill adrenaline
adrenalineFastHitsDescription: "Fast hits needed to fill the gauge. A charged hit or a perfect shield block counts as two."
adrenalineDecay: Adrenaline decay
adrenalineDecayDescription: "Charge slowly drains between fights."
finisherEnabled: Adrenaline weapon finishers
finisherEnabledDescription: "Spend a full charge on a lethal charged weapon strike."
groundFinisherEnabled: Ground finishers
groundFinisherEnabledDescription: "Release a charged attack while aiming at a fallen enemy below the health threshold."
backstabEnabled: Dual-dagger backstab
backstabEnabledDescription: "Sneak behind an unaware humanoid NPC with two short blades to ready and execute a stealth backstab."
groundFinisherHealth: Ground finisher health threshold, %
groundFinisherHealthDescription: "The enemy's health must be strictly below this percentage of their maximum health."
superKickEnabled: Adrenaline super kick
superKickEnabledDescription: "A stronger kick at full charge. Requires kick, adrenaline and ragdoll."
dualWieldEnabled: Dual short blades
dualWieldEnabledDescription: "Paired animations and strikes with two equipped short blades."

kickBinding: "Kick button"

kickBindingDescription: "Click, then press a button; Esc clears."

grabBinding: "Grab / drop item button"

grabBindingDescription: "Click, then press a button; Esc clears."

sprintBinding: "Sprint button"

sprintBindingDescription: "Click, then press a button; Esc clears."
cameraMotionMovement: Camera motion when moving
cameraMotionMovementDescription: "Dark Messiah's head tilt while strafing, backing up and landing. With the first-person body the view always rides its torso, so steps and crouching move it with the body. Action camera motion stays."
