PageName: Brutal Morrowind
Blank: ''
"On": Вкл
"Off": Выкл
PageDescription: "Настройте компоненты мода."
PageDescriptionNoDarkMessiah: "Настройте компоненты мода.\n\nДанные Dark Messiah не импортированы: используются анимации Morrowind, компоненты, которым нужны анимации, звуки или текстуры Dark Messiah, выключены. Импортируйте их на странице Dark Messiah в лаунчере."
GroupName: Настройки
darkMessiah: Dark Messiah
morrowind: Morrowind
enabled: Включить Brutal Morrowind
enabledDescription: "Общий выключатель. Выбор отдельных компонентов сохраняется."
allowThirdPerson: Разрешить вид от третьего лица
allowThirdPersonDescription: "Смена вида — нажатие колёсика мыши. Временно отключает компоненты первого лица."
firstPersonBody: Видимое тело от первого лица (FPV)
firstPersonBodyDescription: "Показывает собственное тело при взгляде вниз."
firstPersonAnimations: Анимации от первого лица
firstPersonAnimationsDescription: "Набор анимаций рук и оружия."
npcAnimations: Анимации NPC
npcAnimationsDescription: "Набор анимаций персонажей."
guaranteedHits: 100% шанс попадания в ближнем бою
guaranteedHitsDescription: "Выключите, чтобы вернуть исходный шанс попадания по навыкам и усталости."
meleeGeometry: Контакт оружия и широкие удары
meleeGeometryDescription: "Попадания по видимой модели оружия и области взмаха."
ragdollEnabled: Ragdoll
ragdollEnabledDescription: "Физические падения NPC и существ, включая улучшения тел, пределы суставов, физику выпавшего снаряжения и подъём живых NPC (подъёму нужны анимации Dark Messiah)."
ragdollWeaponDrop: Шанс выпадения оружия, %
ragdollWeaponDropDescription: "Шанс выпадения каждого оружия из рук живого сбитого с ног NPC. При смерти оружие выпадает всегда. Этот шанс также применяется к щитам и заряженным боеприпасам."
deathSceneEnabled: Сцена смерти игрока
deathSceneEnabledDescription: "Камера следует за головой игрока, а фон за меню смерти плавно темнеет. Отключение возвращает обычную анимацию смерти от третьего лица."
dynamicProps: Физика предметов мира
dynamicPropsDescription: "Удары сдвигают лежащие предметы."
objectGrabEnabled: Захват и бросок предметов
objectGrabEnabledDescription: "Поднимайте небольшие предметы мира, переносите их, опускайте или бросайте во врагов. В адреналине бросок сбивает врага с ног (ragdoll)."
movementEnabled: Ходьба, бег и спринт
movementEnabledDescription: "Скорости Dark Messiah. Alt — ходьба; кнопка спринта задаётся выше."
staminaEnabled: Выносливость Dark Messiah
staminaEnabledDescription: "Восстановление и затраты сил по правилам Dark Messiah."
kickEnabled: Пинок
kickEnabledDescription: "Пинок назначенной кнопкой."
kickAlwaysRagdoll: Пинок всегда вызывает ragdoll
kickAlwaysRagdollDescription: "Обычный не адреналиновый пинок всегда сбивает NPC и поддерживаемых существ в ragdoll с обычным уроном, расходом запаса сил и силой отбрасывания."
slideEnabled: Подкат
slideEnabledDescription: "Присядьте во время спринта или бега, чтобы сделать подкат."
activeBlockEnabled: Ручной блок
activeBlockEnabledDescription: "Удерживайте ПКМ для защиты щитом."
shieldBashEnabled: Удар щитом
shieldBashEnabledDescription: "Клик атаки из блока щитом наносит толчок."
parryEnabled: Парирование оружием
parryEnabledDescription: "Удерживайте ПКМ для защиты оружием."
clinchEnabled: Клинч клинков
clinchEnabledDescription: "Атакуйте после парирования. Нужны анимации Dark Messiah."
attackCombosEnabled: Атаки с разбега и в падении
attackCombosEnabledDescription: "Особые удары с разбега и во время прыжка."
fastAttacksEnabled: Связки быстрых атак
fastAttacksEnabledDescription: "Связки короткими кликами. Нужны анимации рук Dark Messiah."
wallBounceEnabled: Отскок оружия от стен
wallBounceEnabledDescription: "Оружие отскакивает при ударе об окружение."
npcAiTweaks: Изменения ИИ NPC
npcAiTweaksDescription: "Темп боя, замахи и уклонения Dark Messiah."
npcStagger: Реакции NPC на удары
npcStaggerDescription: "Противники вздрагивают и пошатываются от ударов."
woundedNpcs: Раненые NPC
woundedNpcsDescription: "Ниже 30% здоровья NPC сражается и ходит раненым, как в Dark Messiah: его парирование и блок щитом часто не выдерживают, удары его пошатывают, а заряженный удар, пинок или удар щитом могут сбить с ног. Аргониане и каджиты сохраняют свою стойку и походку."
npcFlee: Бегство NPC
npcWeaponPickup: NPC подбирают оружие
physicalProjectiles: Физические стрелы и снаряды
physicalProjectilesDescription: "Стрелы, болты и метательное оружие летят по дуге и попадают во всё, чего коснутся, без проверки навыка. Они остаются в телах до обыска, втыкаются в дерево и деревянные щиты, отскакивают от камня и металла. Поднятый щит блокирует только те снаряды, которые в него попали."
npcWeaponPickupDescription: "NPC, оставшийся в бою без оружия, бежит к лежащему рядом оружию, подбирает его и дерётся им. Щит, лежащий совсем рядом, он тоже забирает."
npcFleeDescription: "Удар, после которого у NPC остаётся меньше 10% здоровья, обращает его в бегство на срок до 20 секунд; затем он снова дерётся до следующего удара."
hitRecovery: Убрать оглушение игрока
hitRecoveryDescription: "Полученный урон не прерывает действия игрока."
adrenalineEnabled: Адреналин и добивания
adrenalineEnabledDescription: "Попадания копят заряд для добивания или сверхпинка."
slowMotionEnabled: Замедление при добивании
slowMotionEnabledDescription: "Краткое замедление после смертельного адреналинового удара."
dismemberment: Расчленение
dismembermentDescription: "Отсечение частей тела при добивании. Требует ragdoll."
damageFlash: Вспышка при получении урона
damageFlashDescription: "Края экрана ненадолго краснеют, когда игрок получает урон."
lowHealthVignette: Виньетка низкого здоровья
lowHealthVignetteDescription: "Красная рамка по краям экрана появляется, когда у игрока меньше 5 единиц здоровья."
bloodEffects: Эффекты крови
bloodEffectsDescription: "Брызги крови мода."
sparkEffects: Искры при ударе
sparkEffectsDescription: "Искры при попадании по металлу и окружению."
bloodDecals: Следы крови
bloodDecalsDescription: "Следы крови на телах и поверхностях."
weaponBlood: Кровь на оружии
weaponBloodDescription: "Оружие ближнего боя остаётся в крови тех, кого оно ранило. Кровь засыхает, смывается дождём и водой, стирается при ремонте и сходит за сутки."
worldBlood: Кровь на полу и стенах
worldBloodDescription: "Попадания оставляют брызги на полу и стенах. Наступив в свежую лужу, игрок и NPC оставляют кровавые следы."
combatSounds: Звуки Dark Messiah
combatSoundsDescription: "Звуки оружия, попаданий, пинков, адреналина, шагов, прыжков и приземлений из Dark Messiah. Выключено: звуки Morrowind."
heroVoice: Голос героя
heroVoiceDescription: "Возгласы героя из Dark Messiah: при ударе или сверхпинке с адреналином, при броске и при прыжке. Остальные звуки Dark Messiah остаются."
adrenalineHudEnabled: Шкала адреналина
adrenalineHudEnabledDescription: "Индикатор заряда рядом с исходными шкалами."
adrenalineFxEnabled: Экранный эффект адреналина
adrenalineFxEnabledDescription: "Экранный эффект при полном заряде."
slideFxEnabled: Эффект скорости подката
slideFxEnabledDescription: "Полосы скорости по краям экрана."
clinchFxEnabled: Размытие после клинча
clinchFxEnabledDescription: "Краткое размытие после проигранного клинча."
superKickSpeed: Импульс адреналинового пинка
superKickSpeedDescription: "Скорость отбрасывания сверхпинком. Обычный пинок — 460 ед/с."
adrenalineFastHits: Быстрых ударов до полного адреналина
adrenalineFastHitsDescription: "Число быстрых попаданий до полного заряда. Заряженный удар или идеальный блок щитом считаются за два."
adrenalineDecay: Убывание адреналина
adrenalineDecayDescription: "Заряд постепенно убывает вне боя."
finisherEnabled: Адреналиновые добивания оружием
finisherEnabledDescription: "Полный заряд даёт смертельный заряженный удар оружием."
groundFinisherEnabled: Добивания на земле
groundFinisherEnabledDescription: "Отпустите заряженную атаку, прицелившись в лежащего врага со здоровьем ниже указанного порога."
backstabEnabled: Удар в спину двумя кинжалами
backstabEnabledDescription: "Подкрадитесь со спины к необнаруженному NPC-гуманоиду с двумя короткими клинками для скрытной казни."
groundFinisherHealth: Порог здоровья для добивания, %
groundFinisherHealthDescription: "Добивание доступно, когда здоровье врага строго ниже этого процента от максимума."
superKickEnabled: Адреналиновый сверхпинок
superKickEnabledDescription: "Усиленный пинок за полный заряд. Нужны пинок, адреналин и ragdoll."
dualWieldEnabled: Два коротких клинка
dualWieldEnabledDescription: "Парные анимации и удары двумя надетыми короткими клинками."

kickBinding: "Кнопка пинка"

kickBindingDescription: "Нажмите и задайте кнопку; Esc — убрать."

grabBinding: "Кнопка захвата / отпускания предмета"

grabBindingDescription: "Нажмите и задайте кнопку; Esc — убрать."

sprintBinding: "Кнопка спринта"

sprintBindingDescription: "Нажмите и задайте кнопку; Esc — убрать."
cameraMotionMovement: Покачивание камеры при движении
cameraMotionMovementDescription: "Наклоны камеры Dark Messiah при движении вбок, назад и приземлении. С видимым телом взгляд всегда держится на его торсе: шаги и приседание двигают его вместе с телом. Движения камеры при действиях остаются."
